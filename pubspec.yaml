name: ema
description: "Elderly Medical Appointment"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter
  
  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # Text-to-Speech
  flutter_tts: ^4.0.2
  
  # Speech-to-Text
  elevenlabs_flutter_updated: ^0.0.1
  
  # Permissions
  permission_handler: ^11.3.1
  
  # File System
  path_provider: ^2.1.4
  
  # HTTP Client
  dio: ^5.4.3+1
  
  # Date/Time Formatting
  intl: ^0.19.0
  
  # Sharing
  share_plus: ^10.1.2
  
  # Notifications
  flutter_local_notifications: ^17.2.3
  
  # Dependency Injection
  get_it: ^7.7.0
  
  # Value Equality
  equatable: ^2.0.5
  
  # Environment Variables
  flutter_dotenv: ^5.1.0
  
  # State Management
  provider: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  
  # Code Generation
  build_runner: ^2.4.9
  hive_generator: ^2.0.1
  freezed: ^2.5.2
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
