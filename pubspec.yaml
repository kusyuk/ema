name: ema
description: "Elderly Medical Appointment"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter
  
  dio: ^5.4.3+1
  elevenlabs_flutter_updated: ^0.0.1
  equatable: ^2.0.5
  record: ^5.1.3
  just_audio: ^0.9.40
  flutter_dotenv: ^5.1.0
  flutter_local_notifications: ^17.2.3
  flutter_tts: ^4.0.2
  get_it: ^7.7.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  intl: ^0.19.0
  path_provider: ^2.1.4
  permission_handler: ^11.3.1
  provider: ^6.1.2
  share_plus: ^10.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  
  build_runner: ^2.4.9
  freezed: ^2.5.2
  hive_generator: ^2.0.1
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  
  assets:
    - .env

dependency_overrides:
  # Fix compatibility issue with record_linux
  record_linux: ^1.2.1
